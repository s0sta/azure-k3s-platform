# Every night: terraform plan -detailed-exitcode. Exit code 2 = someone changed Azure by hand → open an issue.
name: drift
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions: { contents: read, id-token: write, issues: write }
env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
jobs:
  drift:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8, terraform_wrapper: false }
      - run: |
          printf 'resource_group_name="%s"\nstorage_account_name="%s"\ncontainer_name="tfstate"\nkey="azure-k3s-platform/lab.tfstate"\n' \
            "${{ vars.TFSTATE_RG }}" "${{ vars.TFSTATE_ACCOUNT }}" > backend.hcl
          terraform init -backend-config=backend.hcl
      - id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -lock=false -no-color > plan.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({ ...context.repo, title: 'Drift detected in Azure', labels: ['drift'],
              body: 'The nightly plan found changes that are not in Git. See the run: ' + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - if: steps.plan.outputs.code == '1'
        run: exit 1
