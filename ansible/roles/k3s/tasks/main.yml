---
- name: Config folder
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0700"

- name: Read the join token from Key Vault with the VM's managed identity
  ansible.builtin.shell: |
    set -o pipefail
    TOKEN=$(curl -sf -H Metadata:true \
      "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net" | jq -r .access_token)
    curl -sf -H "Authorization: Bearer $TOKEN" \
      "https://{{ key_vault_name }}.vault.azure.net/secrets/k3s-token?api-version=7.4" | jq -r .value
  args: { executable: /bin/bash }
  register: k3s_token
  changed_when: false
  no_log: true

- name: Store the token for the installer (root only)
  ansible.builtin.copy:
    dest: "{{ k3s_token_file }}"
    content: "{{ k3s_token.stdout }}"
    mode: "0600"
  no_log: true

- name: Write the k3s config
  ansible.builtin.template:
    src: "config-{{ k3s_role }}.yaml.j2"
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  register: k3s_config

- name: Pod Security Admission defaults (server)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/psa.yaml
    mode: "0600"
    content: |
      apiVersion: apiserver.config.k8s.io/v1
      kind: AdmissionConfiguration
      plugins:
        - name: PodSecurity
          configuration:
            apiVersion: pod-security.admission.config.k8s.io/v1
            kind: PodSecurityConfiguration
            defaults: { enforce: baseline, enforce-version: latest, audit: restricted, warn: restricted }
            exemptions:
              namespaces: [kube-system, monitoring, logging, cert-manager]
  when: k3s_role == 'server'

- name: API server audit policy (server)
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    mode: "0600"
  when: k3s_role == 'server'

- name: Download the k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /usr/local/bin/k3s-install.sh
    mode: "0700"

- name: Is k3s installed?
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Install k3s {{ k3s_version }}
  ansible.builtin.command: /usr/local/bin/k3s-install.sh {{ 'server' if k3s_role == 'server' else 'agent' }}
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: not k3s_bin.stat.exists
  changed_when: true

- name: Restart k3s after a config change
  ansible.builtin.systemd:
    name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
    state: restarted
  when: k3s_bin.stat.exists and k3s_config.changed

- name: Wait for the node to be Ready (server)
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  when: k3s_role == 'server'
