# Ship container logs and the k3s audit log to Loki; drop secrets before they leave the node.
config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On
    [INPUT]
        Name              tail
        Path              /var/log/k3s-audit.log
        Tag               audit.*
        Mem_Buf_Limit     10MB
  filters: |
    [FILTER]
        Name              kubernetes
        Match             kube.*
        Merge_Log         On
        Keep_Log          Off
    [FILTER]
        Name              modify
        Match             *
        Remove            password
        Remove            authorization
  outputs: |
    [OUTPUT]
        Name              loki
        Match             kube.*
        Host              loki-gateway.logging.svc
        Port              80
        Labels            job=fluent-bit, namespace=$kubernetes['namespace_name'], app=$kubernetes['labels']['app.kubernetes.io/name']
    [OUTPUT]
        Name              loki
        Match             audit.*
        Host              loki-gateway.logging.svc
        Port              80
        Labels            job=k3s-audit
