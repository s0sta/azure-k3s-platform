---
- name: Update all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: 3600

- name: Install security packages
  ansible.builtin.apt:
    name: [auditd, fail2ban, unattended-upgrades, apparmor-utils, chrony]
    state: present

- name: Automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-local
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins { "${distro_id}:${distro_codename}-security"; };
      Unattended-Upgrade::Automatic-Reboot "{{ unattended_reboot | lower }}";

- name: SSH hardening
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Kernel and network settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    reload: true
  loop: "{{ sysctl | dict2items }}"
  vars:
    sysctl:
      kernel.kptr_restrict: 2
      kernel.dmesg_restrict: 1
      kernel.unprivileged_bpf_disabled: 1
      net.ipv4.conf.all.rp_filter: 1
      net.ipv4.conf.all.accept_redirects: 0
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.all.log_martians: 1
      net.ipv4.tcp_syncookies: 1
      fs.protected_hardlinks: 1
      fs.protected_symlinks: 1
      vm.overcommit_memory: 1        # required by k3s --protect-kernel-defaults
      kernel.panic: 10
      kernel.panic_on_oops: 1

- name: Audit rules (identity, sudo, SSH, time, k3s)
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/50-hardening.rules
    mode: "0640"
  notify: Load audit rules

- name: Fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      backend = systemd
      maxretry = {{ fail2ban_maxretry }}
      bantime = {{ fail2ban_bantime }}
      bantime.increment = true
  notify: Restart fail2ban

- name: Services on
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [auditd, fail2ban, chrony, unattended-upgrades]
